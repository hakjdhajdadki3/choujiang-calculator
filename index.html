<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖概率计算器</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --hover-color: #45a049;
            --bg-color: #f5f5f5;
            --card-color: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --highlight-color: #e8f5e9;
            --warning-color: #ff9800;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-color);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 15px;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin: 0 0 15px 0;
            font-size: 20px;
        }
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }
        .input-group {
            flex: 1;
            min-width: 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
        }
        .auto-update {
            display: flex;
            align-items: center;
            margin: 12px 0 5px 0;
            font-size: 13px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 20px;
            margin-right: 8px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .2s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary-color);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--bg-color);
            font-weight: 600;
            font-size: 13px;
        }
        .highlight {
            font-weight: 600;
            color: var(--primary-color);
        }
        .percentage {
            font-weight: 600;
            color: var(--primary-color);
        }
        .warning {
            color: var(--warning-color);
            background-color: #fff8e1;
            padding: 8px 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px;
            font-weight: 500;
        }
        .results h2 {
            font-size: 16px;
            margin: 5px 0 10px 0;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎉 抽奖概率计算器</h1>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="prizes">奖品数量</label>
                    <input type="number" id="prizes" min="1" value="3">
                </div>
                <div class="input-group">
                    <label for="total">总人数</label>
                    <input type="number" id="total" min="1" value="7">
                </div>
                <div class="input-group">
                    <label for="mine">我的人数</label>
                    <input type="number" id="mine" min="1" value="4">
                </div>
            </div>
            
            <div class="auto-update">
                <label class="switch">
                    <input type="checkbox" id="autoUpdate" checked>
                    <span class="slider"></span>
                </label>
                <label for="autoUpdate">实时计算</label>
            </div>
        </div>
        
        <div class="card results" id="result">
            <h2>中奖概率分析</h2>
            <div id="warning"></div>
            <table id="probabilityTable">
                <thead>
                    <tr>
                        <th>中奖情况</th>
                        <th>概率</th>
                    </tr>
                </thead>
                <tbody id="probabilityBody">
                    <!-- 结果将在这里动态生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const prizesInput = document.getElementById('prizes');
        const totalInput = document.getElementById('total');
        const mineInput = document.getElementById('mine');
        const autoUpdateCheckbox = document.getElementById('autoUpdate');
        const resultDiv = document.getElementById('result');
        const probabilityBody = document.getElementById('probabilityBody');
        const warningDiv = document.getElementById('warning');
        
        // 添加输入事件监听器
        [prizesInput, totalInput, mineInput].forEach(input => {
            input.addEventListener('input', () => {
                if (autoUpdateCheckbox.checked) {
                    calculateProbability();
                }
            });
        });
        
        // 自动更新切换
        autoUpdateCheckbox.addEventListener('change', () => {
            if (autoUpdateCheckbox.checked) {
                calculateProbability();
            }
        });
        
        // 初始计算
        calculateProbability();
        
        function calculateProbability() {
            // 获取输入值
            const prizes = parseInt(prizesInput.value);
            const total = parseInt(totalInput.value);
            const mine = parseInt(mineInput.value);
            
            // 验证输入
            if (isNaN(prizes) || isNaN(total) || isNaN(mine) || 
                prizes < 1 || total < 1 || mine < 1) {
                resultDiv.style.display = 'none';
                return;
            }
            
            if (mine > total) {
                warningDiv.innerHTML = `<div class="warning">⚠️ 我的人数不能超过总人数</div>`;
                resultDiv.style.display = 'block';
                probabilityBody.innerHTML = '';
                return;
            }
            
            // 清空警告
            warningDiv.innerHTML = '';
            
            // 特殊提示
            if (prizes > total) {
                warningDiv.innerHTML = `<div class="warning">🎁 奖品超过总人数，所有人都会中奖</div>`;
            }
            
            // 计算所有可能情况的概率
            const probabilities = [];
            const totalComb = combination(total, prizes);
            const maxPossible = Math.min(prizes, mine);
            
            for (let k = 0; k <= maxPossible; k++) {
                const combMine = combination(mine, k);
                const combOthers = combination(total - mine, prizes - k);
                const probability = totalComb > 0 ? (combMine * combOthers) / totalComb : 0;
                probabilities.push({
                    k: k,
                    probability: probability,
                    percentage: (probability * 100).toFixed(2)
                });
            }
            
            // 计算至少1人中奖的概率
            const probAtLeastOne = probabilities[0].probability > 0 ? 
                                 (1 - probabilities[0].probability) : 1;
            
            // 生成结果表格
            let tableHtml = '';
            
            // 添加"至少1人中奖"行
            tableHtml += `
                <tr class="highlight">
                    <td>至少1人中奖</td>
                    <td class="percentage">${(probAtLeastOne * 100).toFixed(2)}%</td>
                </tr>
            `;
            
            // 添加其他中奖情况行
            for (let i = 1; i < probabilities.length; i++) {
                const p = probabilities[i];
                tableHtml += `
                    <tr>
                        <td>恰好 ${p.k} 人中奖</td>
                        <td class="percentage">${p.percentage}%</td>
                    </tr>
                `;
            }
            
            probabilityBody.innerHTML = tableHtml;
            resultDiv.style.display = 'block';
        }
        
        // 计算组合数C(n, k)
        function combination(n, k) {
            if (k < 0 || k > n) return 0;
            if (k === 0 || k === n) return 1;
            if (k > n - k) k = n - k;
            let res = 1;
            for (let i = 1; i <= k; i++) {
                res = res * (n - k + i) / i;
            }
            return res;
        }
    </script>
</body>
</html>
